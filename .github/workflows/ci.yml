name: NagrikPulse CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-test:
    name: Build, Lint & Automated Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Static Typecheck
        run: npm run lint

      - name: Production Bundle Build Check
        run: npm run build
        env:
          NODE_ENV: production
          VITE_APP_URL: https://nagrikpulse.gov.in

      - name: PostGIS Schema Verification
        run: |
          echo "Verifying PostGIS SQL syntax integrity..."
          test -f supabase/migrations/20261005_civic_pulse_postgis_schema.sql
          echo "Migration file valid!"
